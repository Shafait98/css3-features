<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explore animation</title>
    <style>
       
       @keyframes slide {

        from{
            left: 0;
        }

        to
        {
            left: 500px;
        }
        
       }

       @keyframes bounce {

        0%{
            left:0px;
            top:0px;
        }

        25%
        {
            left:150px;
            top:200px;
        }

        50%
        {
            left:300px;
            top:0px;
        }
        100%
        {
            left:500px;
            top:200px;
        }
        
       }


        .stage
        {
            width: 600px;
            height: 300px;
            border: 2px solid blue;
        }

        .ball
        {
            width:100px;
            height:100px;
            border-radius: 50%;
            background-color: red;
            position: relative;
            animation: bounce 3s ease-in 1s infinite alternate ;
            /* animation: slide 3s  ease-in-out 1s infinite alternate; */
        }

    </style>
</head>
<body>
    <h2>Explore Animation</h2>
    <div class="stage">
        <div class="ball">

        </div>
    </div>
</body>
</html>
